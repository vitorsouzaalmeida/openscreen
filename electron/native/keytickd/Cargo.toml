# OpenScreen key timing service (Linux).
#
# A standalone package, like `../pipewire-capture/`, and for the same reason: it
# is its own executable, not part of the compositor workspace in `crates/`.
#
# It is deliberately NOT part of the capture helper either. The helper runs as
# the user, inside the app's process tree, and promises never to read a keyboard
# (see `../pipewire-capture/src/input.rs`). This binary is the only code that
# does, and it runs as a locked-down system service that hands out nothing but
# press times, a coarse key class and a per-take scrambled voice number.
#
# Dependencies are kept to the two the capture helper already vendors, so the
# service can be audited in one sitting.

[package]
name = "openscreen-keytickd"
version = "0.0.0"
edition = "2021"
publish = false
license = "MIT"

[workspace]

[[bin]]
name = "openscreen-keytickd"
path = "src/main.rs"

[dependencies]
evdev = "0.13"
libc = "0.2"

[profile.release]
opt-level = 2
lto = true
strip = true
